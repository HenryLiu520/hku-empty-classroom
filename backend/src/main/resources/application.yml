server:
  port: 8080
  # 只听本机：这是本机演示用的原型，不需要让同网段的其他人访问
  address: 127.0.0.1

spring:
  application:
    name: empty-classroom
  servlet:
    multipart:
      # 单张照片上限 3 MB（与 ReviewPhotoService.MAX_BYTES 一致），整请求留一点余量
      max-file-size: 3MB
      max-request-size: 4MB
  datasource:
    url: jdbc:postgresql://localhost:5433/emptyclassroom
    username: ${USER:ran}
    password: ""
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Hong_Kong
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  # 评价照片存放目录（文件在磁盘、数据库只存指针）
  upload-dir: ./uploads/review-photos
  # 换场缓冲：两个相邻占用段之间至少留这么多分钟，才算“可用”
  buffer-minutes: 10
  # 教室开放时段（超出这个范围不展示为空闲）
  opening-start: "08:00"
  opening-end: "22:00"
  # 原型阶段的极简鉴权（非生产）
  cors-allowed-origin: "http://localhost:5173"

logging:
  level:
    org.hibernate.SQL: warn
