<rect x="40" y="54" width="522" height="132" rx="10" fill="#e8f0fb" stroke="#7aa7d9" stroke-width="1.6"/>
<text x="58" y="76" font-family='-apple-system, "Helvetica Neue", Arial, sans-serif' font-size="13.4" font-weight="700" fill="#1c3f6e" text-anchor="start">Desktop client · Vue 3 · localhost:5173</text>
<text x="58" y="96" font-family='-apple-system, "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#5c6b67" text-anchor="start">one application, three account roles</text>
<text x="58" y="115.0" font-family='-apple-system, "Helvetica Neue", Arial, sans-serif' font-size="9.9" font-weight="400" fill="#5c6b67" text-anchor="start">student: search and room pages, and your own review</text>
<text x="58" y="131.5" font-family='-apple-system, "Helvetica Neue", Arial, sans-serif' font-size="9.9" font-weight="400" fill="#5c6b67" text-anchor="start">administrator: the same app plus change room use time and facilities</text>
<text x="58" y="148.0" font-family='-apple-system, "Helvetica Neue", Arial, sans-serif' font-size="9.9" font-weight="400" fill="#5c6b67" text-anchor="start">super administrator: the same app plus account management</text>
<text x="58" y="172" font-family='-apple-system, "Helvetica Neue", Arial, sans-serif' font-size="9.4" font-weight="400" fill="#1c3f6e" text-anchor="start">what a role may do is enforced by the server, not by hiding buttons</text>
<rect x="598" y="54" width="522" height="132" rx="10" fill="#e8f0fb" stroke="#7aa7d9" stroke-width="1.6"/>
