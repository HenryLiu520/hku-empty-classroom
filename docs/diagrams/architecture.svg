<text x="616" y="96" font-family='-apple-system, "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#5c6b67" text-anchor="start">a second front end for the same backend, for the student view</text>
<text x="616" y="115.0" font-family='-apple-system, "Helvetica Neue", Arial, sans-serif' font-size="9.9" font-weight="400" fill="#5c6b67" text-anchor="start">find a free room, a room's timetable, reviews and photos</text>
<text x="616" y="131.5" font-family='-apple-system, "Helvetica Neue", Arial, sans-serif' font-size="9.9" font-weight="400" fill="#5c6b67" text-anchor="start">calls the same /api with the same token: no second API, no copied rules</text>
<text x="616" y="148.0" font-family='-apple-system, "Helvetica Neue", Arial, sans-serif' font-size="9.9" font-weight="400" fill="#5c6b67" text-anchor="start">administrator work stays on the desktop, where it is not a one-thumb task</text>
<text x="616" y="172" font-family='-apple-system, "Helvetica Neue", Arial, sans-serif' font-size="9.4" font-weight="400" fill="#1c3f6e" text-anchor="start">same origin in development: the dev server forwards /api to 8080</text>
